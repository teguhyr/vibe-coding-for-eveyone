# Contoh workflow GitHub Actions (Modul 7). Salin ke .github/workflows/ci.yml di repositori Anda.
# File di folder latihan ini TIDAK dijalankan oleh GitHub karena tidak berada di .github/workflows/.
name: CI

on:
  push:
  pull_request:

jobs:
  modules:
    name: Modul (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  backend:
    name: Backend ruang rapat
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training/mahir/latihan/kunci/backend-lengkap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../../ruang-rapat/backend/requirements.txt -r ../../../../../requirements-dev.txt
      - run: pytest
